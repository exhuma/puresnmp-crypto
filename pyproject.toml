[project]
name = "puresnmp-crypto"
version = "1.0.1.post1"
description = "Implementation for SNMPv3 encryption in puresnmp"
authors = [{name="Michel Albert", email="michel.albert@post.lu"}]
license = {text="MIT"}
readme = "README.rst"
requires-python = ">=3.7"
dependencies = [
    "cryptography >= 38.0.1",
]

[project.urls]
homepage = "https://pypi.org/project/puresnmp/"
repository = "https://github.com/exhuma/puresnmp-crypto"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "black",
    "pylint",
    "sphinx",
    "furo",
    "pre-commit",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=puresnmp_plugins --cov-report=term-missing --cov-fail-under=100"
testpaths = [
    "tests",
]

[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[tool.uv.dependency-groups]
# Current dev tooling needs a modern Python. This only limits the dev
# environment; the published requires-python stays at the old CI floor.
dev = { requires-python = ">=3.10" }
