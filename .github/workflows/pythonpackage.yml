---
name: Python package

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  # Monthly run: detects breakage caused by new Python releases.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: Compute Python versions
    runs-on: ubuntu-latest
    outputs:
      supported: ${{ steps.compute.outputs.supported }}
      latest: ${{ steps.compute.outputs.latest }}
      next: ${{ steps.compute.outputs.next }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch supported CPython versions from endoflife.date
        id: compute
        run: |
          if ! curl --fail --silent --show-error --location --retry 3 \
              --output eol.json https://endoflife.date/api/python.json; then
            echo "::error::Could not fetch https://endoflife.date/api/python.json; refusing to fall back to a pinned version list."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import date

          today = date.today().isoformat()
          with open("eol.json") as fp:
              cycles = json.load(fp)

          def key(cycle):
              return tuple(int(p) for p in cycle.split("."))

          # Released (release date in the past) and not yet end-of-life.
          supported = sorted(
              (
                  c["cycle"]
                  for c in cycles
                  if str(c["releaseDate"]) <= today
                  and c["eol"] is not True
                  and (c["eol"] is False or str(c["eol"]) > today)
              ),
              key=key,
          )
          if not supported:
              raise SystemExit("::error::endoflife.date returned no supported CPython version")
          major, minor = key(supported[-1])
          next_version = f"{major}.{minor + 1}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"supported={json.dumps(supported)}\n")
              out.write(f"latest={supported[-1]}\n")
              out.write(f"next={next_version}\n")
          print("supported:", supported, "next:", next_version)
          PY

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.versions.outputs.supported) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The package declares no requires-python, so uv derives the lock's
      # Python range from the interpreter. "--locked" would therefore fail on
      # any interpreter other than the one in .python-version; "--frozen"
      # installs exactly what uv.lock says. The lock itself is verified in the
      # lint job.
      - name: Install dependencies
        run: uv sync --frozen --python '${{ steps.python.outputs.python-path }}'

      - name: Run unit tests
        run: uv run --frozen pytest --tb=short

  prerelease:
    name: Test (upcoming Python ${{ needs.versions.outputs.next }}, may fail)
    needs: versions
    runs-on: ubuntu-latest
    # Informational only: never fails the workflow or blocks publishing.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Set up Python ${{ needs.versions.outputs.next }} (pre-release)
        id: python
        # Fails when no pre-release of the next version exists yet.
        continue-on-error: true
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.versions.outputs.next }}
          allow-prereleases: true

      - name: Note missing pre-release
        if: steps.python.outcome != 'success'
        run: echo "::notice::No Python ${{ needs.versions.outputs.next }} (pre-)release is available yet; skipping."

      - name: Install dependencies
        if: steps.python.outcome == 'success'
        run: uv sync --frozen --python '${{ steps.python.outputs.python-path }}'

      - name: Run unit tests
        if: steps.python.outcome == 'success'
        run: uv run --frozen pytest --tb=short

  quality-control:
    runs-on: ubuntu-latest
    needs: versions
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      # Uses the interpreter pinned in .python-version, which is the one the
      # lock was created with.
      - name: Check that uv.lock is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked

      - name: Check pre-commit rules
        run: uv run --locked pre-commit run --all-files

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Build distribution
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: Packages
          path: dist/

  publish:
    needs: [test, quality-control, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download the built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
